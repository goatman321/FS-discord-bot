name: Free spiny dnes

on:
  schedule:
    # GitHub cron běží v UTC. 13:00 pražského času je:
    #   - 11:00 UTC v letním čase (CEST)
    #   - 12:00 UTC v zimním čase (CET)
    # Spouští se oba crony, scraper sám pustí jen ten správný.
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch: # ruční spuštění tlačítkem "Run workflow"

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Stáhnutí repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalace závislostí
        run: pip install -r requirements.txt

      - name: Spuštění scraperu
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_SCHEDULE: ${{ github.event.schedule }}
        run: python scraper.py

name: Casino Scraper

on:
  schedule:
    # Spouští se každou hodinu v 15. minutě (např. 8:15, 9:15)
  # Záměrně nedáváme 0. minutu, kdy běží miliony dalších botů a fronty na GitHubu bývají plné
    - cron: '15 * * * *'
  workflow_dispatch: # Umožňuje spustit workflow ručně tlačítkem

# Práva nutná k tomu, aby mohl bot commitnout upravenou cache zpět
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnutí repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Spuštění scraperu
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scraper.py

      - name: Commit a push upravené cache
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # 1. Pojistka: Vytvoří prázdný soubor, pokud ho scraper neudělal
          touch cache.json 
          
          # 2. Přidá ho do Gitu (teď už stoprocentně existuje)
          git add cache.json
          
          # 3. Zkontroluje, jestli se v něm něco změnilo. Pokud ano, uloží to.
          git diff --staged --quiet || git commit -m "Aktualizace cache.json"
          
          # 4. Nahraje změny na GitHub
          git push
